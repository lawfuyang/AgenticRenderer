// DDGI SDK Shaders — thin wrappers in src/shaders/ddgi/ that #include the submodule's .hlsl files.
// Common defines are in DDGIShaderConfig.h (included via RTXGI_DDGI_USE_SHADER_CONFIG_FILE=1).

ddgi/DDGIProbeBlendingIrradiance.hlsl -T cs -E DDGIProbeBlendingCS -m 6_8
ddgi/DDGIProbeBlendingDistance.hlsl -T cs -E DDGIProbeBlendingCS -m 6_8 -s _BlendDistance
ddgi/DDGIProbeClassification.hlsl -T cs -E DDGIProbeClassificationCS -m 6_8
ddgi/DDGIProbeClassificationReset.hlsl -T cs -E DDGIProbeClassificationResetCS -m 6_8 -s _Reset
ddgi/DDGIProbeRelocation.hlsl -T cs -E DDGIProbeRelocationCS -m 6_8
ddgi/DDGIProbeRelocationReset.hlsl -T cs -E DDGIProbeRelocationResetCS -m 6_8 -s _Reset
ddgi/DDGIReduction.hlsl -T cs -E DDGIReductionCS -m 6_8
ddgi/DDGIReductionExtra.hlsl -T cs -E DDGIExtraReductionCS -m 6_8 -s _Extra
